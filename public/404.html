<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>СтудFood</title>
    <script>
      // GitHub Pages отдаёт 404.html для любого неизвестного пути (например /vue-cafe/login).
      // Сохраняем реальный путь (с query и hash) и переходим на index,
      // который восстановит адрес через history.replaceState.
      (function () {
        var l = window.location;
        var path = l.pathname.replace(/^\/vue-cafe/, ''); // убираем base
        var target = '/vue-cafe/' + (path || '') + l.search + l.hash;
        sessionStorage.setItem('spa-redirect', target);
        l.replace('/vue-cafe/');
      })();
    </script>
  </head>
  <body>
    Перенаправление…
  </body>
</html>
